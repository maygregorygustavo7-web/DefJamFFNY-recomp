name: Def Jam - V9 Vulkan graphics device test

on:
  push:
    branches: [android-prototype]
    paths:
      - '.github/workflows/android-vulkan-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulkan-and-xbox-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned Xbox recompilation runtime
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reuse working V8 Android Xbox-memory project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -f .github/workflows/android-runtime-v8.yml
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          import subprocess
          src = Path('.github/workflows/android-runtime-v8.yml').read_text(encoding='utf-8')
          steps = [
              'Reuse V7C steps to prepare isolated native module',
              'Supply genuine runtime logging dependency for isolated test',
              'Add host Xbox memory tests using real platform APIs',
          ]
          for idx, name in enumerate(steps, 1):
              heading = '      - name: ' + name + '\n'
              assert src.count(heading) == 1, 'Missing source V8 step: '+name
              a = src.index('        run: |\n', src.index(heading)) + len('        run: |\n')
              b = src.find('\n      - name: ', a)
              if b < 0: b = len(src)
              block = src[a:b].splitlines(keepends=True)
              lines = []
              for line in block:
                  if not line.strip(): lines.append('\n')
                  elif line.startswith('          '): lines.append(line[10:])
                  else: raise SystemExit('Unexpected V8 indent: '+repr(line))
              shell = Path('/tmp/v9-reuse-%d.sh' % idx)
              shell.write_text('set -euo pipefail\n' + ''.join(lines), encoding='utf-8')
              print('Reuse V8:', name, flush=True)
              subprocess.run(['bash', str(shell)], check=True)
          PYEXTRACT

      - name: Add native Vulkan instance GPU and graphics queue checks
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan.h"
          python3 - <<'PYVULKAN'
          from pathlib import Path
          p=Path('android-v7/app/src/main/cpp/xbox_kernel_test.cpp')
          s=p.read_text(encoding='utf-8')
          old='Java_com_defjam_kerneltest_MainActivity_nativeXboxKernelTest('
          assert s.count(old)==1, 'V8 JNI test entry point changed'
          s=s.replace(old, 'defjam_v8_native_memory_test(', 1)
          assert '#include "win32_compat.h"' in s, 'Missing genuine xboxrecomp platform code'
          s=s.replace('#include "win32_compat.h"', '#include "win32_compat.h"\n#include <vulkan/vulkan.h>\n#include <vector>', 1)
          s+=r'''

          // V9: Headless Vulkan graphics-device probe. It creates a REAL VkInstance,
          // enumerates a REAL GPU, finds a graphics-capable queue and creates VkDevice.
          // It does NOT implement Xbox D3D8/NV2A, Vulkan swapchains or any game renderer.
          static void defjam_vulkan_probe(char* output, size_t maxlen) {
              VkApplicationInfo app{};
              app.sType = VK_STRUCTURE_TYPE_APPLICATION_INFO;
              app.pApplicationName = "Def Jam V9 graphics probe";
              app.apiVersion = VK_API_VERSION_1_0;
              VkInstanceCreateInfo info{};
              info.sType = VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO;
              info.pApplicationInfo = &app;
              VkInstance instance = VK_NULL_HANDLE;
              VkResult rc = vkCreateInstance(&info, nullptr, &instance);
              if(rc != VK_SUCCESS || instance == VK_NULL_HANDLE) {
                  std::snprintf(output, maxlen, "Vulkan instancia: FALHOU (codigo %d)\n", (int)rc);
                  return;
              }

              uint32_t count = 0;
              rc = vkEnumeratePhysicalDevices(instance, &count, nullptr);
              if(rc != VK_SUCCESS || count == 0) {
                  std::snprintf(output, maxlen,
                      "Vulkan instancia: PASSOU\nGPU Vulkan: FALHOU (codigo %d; GPUs %u)\n", (int)rc, count);
                  vkDestroyInstance(instance, nullptr);
                  return;
              }
              std::vector<VkPhysicalDevice> devices(count);
              rc = vkEnumeratePhysicalDevices(instance, &count, devices.data());
              if(rc != VK_SUCCESS || count == 0) {
                  std::snprintf(output, maxlen, "Vulkan instancia: PASSOU\nEnumerar GPU: FALHOU (%d)\n", (int)rc);
                  vkDestroyInstance(instance, nullptr);
                  return;
              }
              VkPhysicalDevice gpu = devices[0];
              VkPhysicalDeviceProperties props{};
              vkGetPhysicalDeviceProperties(gpu, &props);

              uint32_t familyCount = 0;
              vkGetPhysicalDeviceQueueFamilyProperties(gpu, &familyCount, nullptr);
              std::vector<VkQueueFamilyProperties> families(familyCount);
              if(familyCount) vkGetPhysicalDeviceQueueFamilyProperties(gpu, &familyCount, families.data());
              uint32_t graphicsFamily = UINT32_MAX;
              for(uint32_t i=0;i<familyCount;i++) {
                  if((families[i].queueFlags & VK_QUEUE_GRAPHICS_BIT) && families[i].queueCount > 0) {
                      graphicsFamily = i;
                      break;
                  }
              }
              bool logicalOK = false;
              VkResult deviceRc = VK_ERROR_INITIALIZATION_FAILED;
              if(graphicsFamily != UINT32_MAX) {
                  float priority = 1.0f;
                  VkDeviceQueueCreateInfo queueInfo{};
                  queueInfo.sType = VK_STRUCTURE_TYPE_DEVICE_QUEUE_CREATE_INFO;
                  queueInfo.queueFamilyIndex = graphicsFamily;
                  queueInfo.queueCount = 1;
                  queueInfo.pQueuePriorities = &priority;
                  VkDeviceCreateInfo deviceInfo{};
                  deviceInfo.sType = VK_STRUCTURE_TYPE_DEVICE_CREATE_INFO;
                  deviceInfo.queueCreateInfoCount = 1;
                  deviceInfo.pQueueCreateInfos = &queueInfo;
                  VkDevice device = VK_NULL_HANDLE;
                  deviceRc = vkCreateDevice(gpu, &deviceInfo, nullptr, &device);
                  if(deviceRc == VK_SUCCESS && device != VK_NULL_HANDLE) {
                      VkQueue queue = VK_NULL_HANDLE;
                      vkGetDeviceQueue(device, graphicsFamily, 0, &queue);
                      logicalOK = queue != VK_NULL_HANDLE;
                      vkDestroyDevice(device, nullptr);
                  }
              }
              std::snprintf(output, maxlen,
                  "Vulkan instancia: PASSOU\n"
                  "GPU Vulkan: %s\n"
                  "API Vulkan da GPU: %u.%u\n"
                  "Fila grafica: %s\n"
                  "VkDevice + fila: %s (codigo %d)\n",
                  props.deviceName, VK_API_VERSION_MAJOR(props.apiVersion),
                  VK_API_VERSION_MINOR(props.apiVersion),
                  graphicsFamily==UINT32_MAX ? "FALHOU" : "PASSOU",
                  logicalOK ? "PASSOU" : "FALHOU", (int)deviceRc);
              vkDestroyInstance(instance, nullptr);
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_defjam_kerneltest_MainActivity_nativeXboxKernelTest(JNIEnv *env, jclass clazz) {
              jstring previous = defjam_v8_native_memory_test(env, clazz);
              if(!previous) return nullptr;
              const char* utf = env->GetStringUTFChars(previous, nullptr);
              if(!utf) return previous;
              char vkReport[1024]{};
              defjam_vulkan_probe(vkReport, sizeof(vkReport));
              int memoryPassed = 0;
              for(const char* found = utf; (found = std::strstr(found, "PASSOU")) != nullptr; found += 6)
                  ++memoryPassed;
              char message[1800]{};
              std::snprintf(message, sizeof(message),
                  "DEF JAM - GPU VULKAN V9\n\n"
                  "Testes da memoria V8: %d / 7\n\n"
                  "=== GPU VULKAN DO CELULAR ===\n%s\n"
                  "Ainda SEM imagem, renderizador Xbox ou jogo.", memoryPassed, vkReport);
              env->ReleaseStringUTFChars(previous, utf);
              return env->NewStringUTF(message);
          }
          '''
          p.write_text(s, encoding='utf-8')
          cm=Path('android-v7/app/src/main/cpp/CMakeLists.txt')
          s=cm.read_text(encoding='utf-8')
          anchor='target_link_options(xboxkerneltest PRIVATE -Wl,--no-undefined)'
          assert s.count(anchor)==1, 'Unexpected CMake linker section'
          s=s.replace(anchor,'target_link_libraries(xboxkerneltest PRIVATE vulkan)\n'+anchor,1)
          cm.write_text(s,encoding='utf-8')

          # New installable application ID so user can keep V7 and V8.
          gradle=Path('android-v7/app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          assert "applicationId 'com.defjam.memorytest'" in g
          assert 'versionCode 8' in g
          g=g.replace("applicationId 'com.defjam.memorytest'", "applicationId 'com.defjam.vulkanprobe'")
          g=g.replace('versionCode 8','versionCode 9').replace("versionName '0.8'", "versionName '0.9'")
          gradle.write_text(g,encoding='utf-8')
          manifest=Path('android-v7/app/src/main/AndroidManifest.xml')
          m=manifest.read_text(encoding='utf-8')
          assert 'Def Jam - Xbox Memory V8' in m
          m=m.replace('Def Jam - Xbox Memory V8','Def Jam - Vulkan GPU V9')
          manifest.write_text(m,encoding='utf-8')
          print('V9 Vulkan probe added to genuine V8 memory test, Vulkan NDK linked, distinct APK app ID')
          PYVULKAN

      - name: Build Android ARM64 real Vulkan probe
        shell: bash
        run: gradle -p android-v7 :app:assembleDebug --no-daemon --stacktrace

      - name: Check ARM64 native library packaged
        shell: bash
        run: |
          unzip -l android-v7/app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libxboxkerneltest.so'

      - name: Upload Android Vulkan V9 test APK
        uses: actions/upload-artifact@v4
        with:
          name: defjam-android-vulkan-v9-apk
          path: android-v7/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
