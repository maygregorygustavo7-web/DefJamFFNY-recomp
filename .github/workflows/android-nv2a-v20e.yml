name: Def Jam - V20E original NV2A relink without runtime ELF patching

'on':
  push:
    branches: [android-prototype]
    paths:
      - '.github/workflows/android-nv2a-v20e.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  nv2a-relink-real-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout pinned Xbox runtime and prior workflows
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rebuild known V20D Android application with persistent checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREUSE'
          from pathlib import Path
          import subprocess
          p=Path('.github/workflows/android-nv2a-v20d.yml')
          source=p.read_text(encoding='utf-8')
          steps=[
              'Reconstruct V20C native project and real NV2A loader fix',
              'Insert native checkpoint recorder and persistent on-screen diagnostics',
          ]
          for i,name in enumerate(steps,1):
              marker='      - name: '+name+'\n'
              assert source.count(marker)==1, 'Missing V20D stage: '+name
              start=source.index('        run: |\n',source.index(marker))+len('        run: |\n')
              end=source.find('\n      - name: ',start)
              if end<0: end=len(source)
              lines=[]
              for line in source[start:end].splitlines(keepends=True):
                  if not line.strip(): lines.append('\n')
                  elif line.startswith('          '): lines.append(line[10:])
                  else: raise RuntimeError('Unexpected YAML indentation: '+repr(line))
              script=Path(f'/tmp/v20e-reuse-{i}.sh')
              script.write_text('set -euo pipefail\n'+''.join(lines),encoding='utf-8')
              subprocess.run(['bash','-n',str(script)],check=True)
              print('V20E reusing known project stage:',name,flush=True)
              subprocess.run(['bash',str(script)],check=True)
          PYREUSE

      - name: Rebuild real Xbox NV2A directly with proper Android DT_NEEDED at link time
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v20e-logs v20e-build v20e-link-reference
          python3 - <<'PYRELINK'
          from pathlib import Path
          import os,subprocess,re,shutil
          root=Path('tools/xboxrecomp/src')
          logs=Path('v20e-logs')
          build=Path('v20e-build')
          android_lib=Path('defjam-v15/app/src/main/jniLibs/arm64-v8a')
          renderer=android_lib/'libxbox_d3d8_vk_experimental.so'
          nv2a_target=android_lib/'libxbox_nv2a_vulkan_v19.so'
          assert renderer.is_file() and renderer.stat().st_size>10000, 'Missing proven V13 Vulkan renderer'
          assert nv2a_target.is_file(), 'Missing NV2A baseline from V20D'
          ndk=Path(os.environ['ANDROID_NDK_HOME'])/'toolchains/llvm/prebuilt/linux-x86_64/bin'
          cc=str(ndk/'aarch64-linux-android28-clang')
          readelf=str(ndk/'llvm-readelf')
          nm=str(ndk/'llvm-nm')
          ref=Path('v20e-link-reference/libxbox_d3d8_vk_experimental.so')
          shutil.copy2(renderer,ref)
          # Fix only a temporary *linker reference* for its SONAME;
          # package the untouched, already proven genuine Vulkan renderer.
          subprocess.run(['patchelf','--set-soname','libxbox_d3d8_vk_experimental.so',str(ref)],check=True)
          soname=subprocess.run(['patchelf','--print-soname',str(ref)],capture_output=True,text=True,check=True).stdout.strip()
          assert soname=='libxbox_d3d8_vk_experimental.so',soname
          (logs/'link-reference-soname.txt').write_text('SONAME of link-only Vulkan copy: '+soname+'\nOriginal packaged Vulkan renderer is UNMODIFIED.\n')
          flags=['-fPIC','-O2','-std=gnu11','-D_GNU_SOURCE','-D_alloca=alloca',
                 '-include','alloca.h','-Wno-unused-parameter','-Wno-unknown-pragmas']
          for d in [root,root/'nv2a',root/'kernel',root/'d3d',root/'platform']:
              flags+=['-I',str(d)]
          files=[('pgraph',root/'nv2a/nv2a_pgraph_d3d11.c'),
                 ('texture_pack',root/'nv2a/texture_pack.c'),
                 ('vsh_cpu',root/'kernel/nv2a_vsh_cpu.c'),
                 ('vsh_interp',root/'kernel/nv2a_vsh_interp.c')]
          objs=[]
          for label,src in files:
              assert src.is_file(),f'Missing original Xbox source: {src}'
              obj=build/(label+'.o')
              cmd=[cc,*flags,'-c',str(src),'-o',str(obj)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              (logs/(label+'-compile.log')).write_text('$ '+' '.join(cmd)+'\n'+p.stdout+'\n'+p.stderr)
              print(label,'compile result:',p.returncode,flush=True)
              if p.returncode: raise SystemExit('Real Xbox module compilation failed: '+label+'\n'+p.stderr[-8000:])
              objs.append(obj)
          output=build/'libxbox_nv2a_vulkan_v19.so'
          cmd=[cc,'-shared','-Wl,--no-undefined',
               '-Wl,-soname,libxbox_nv2a_vulkan_v19.so',
               '-o',str(output),*(str(o) for o in objs),str(ref),
               '-lm','-ldl','-llog','-landroid']
          p=subprocess.run(cmd,capture_output=True,text=True)
          (logs/'native-strict-link.log').write_text('$ '+' '.join(cmd)+'\n'+p.stdout+'\n'+p.stderr)
          if p.returncode: raise SystemExit('NV2A strict link failed: '+p.stderr[-8000:])
          elf=subprocess.run([readelf,'-d',str(output)],capture_output=True,text=True,check=True).stdout
          (logs/'native-nv2a-dynamic.txt').write_text(elf)
          needed=re.findall(r'\(NEEDED\).*?\[(.*?)\]',elf)
          (logs/'native-nv2a-needed.txt').write_text('\n'.join(needed)+'\n')
          assert 'libxbox_d3d8_vk_experimental.so' in needed,needed
          assert all('/' not in lib for lib in needed),needed
          hdr=subprocess.run([readelf,'-h',str(output)],capture_output=True,text=True,check=True).stdout
          assert 'AArch64' in hdr,hdr
          (logs/'native-nv2a-elf-header.txt').write_text(hdr)
          ex=subprocess.run([nm,'-D','--defined-only',str(output)],capture_output=True,text=True,check=True).stdout
          for sym in ['pgraph_d3d11_init','pgraph_d3d11_draw_ready','pgraph_d3d11_get_stats',
                      'nv2a_vsh_constants','nv2a_vsh_emit_hlsl','nv2a_vsh_program_hash']:
              assert re.search(r'\s'+re.escape(sym)+r'$',ex,re.M),f'Xbox NV2A export missing: {sym}'
          shutil.copy2(output,nv2a_target)
          subprocess.run(['sha256sum',str(renderer),str(nv2a_target)],stdout=(logs/'android-libraries-sha256.txt').open('w'),check=True)
          (logs/'summary.txt').write_text('V20E: rebuilt 4 genuine Xbox NV2A sources for ARM64.\n'
             'Linked with a SONAME-correct temporary reference to genuine V13 renderer.\n'
             'Packaged original real Vulkan renderer stays unmodified.\n'
             'New NV2A binary has Android-safe bare DT_NEEDED at link time.\n'
             'No patchelf changes on the NV2A library shipped inside APK.\n'
             'On-device execution still UNTESTED.\n')
          print('V20E: rebuilt real NV2A library with correct DT_NEEDED (no runtime ELF patch).',flush=True)
          PYRELINK

      - name: Rename diagnostic app to V20E and retain crash checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYNAMING'
          from pathlib import Path
          base=Path('defjam-v15')
          gradle=base/'app/build.gradle'
          g=gradle.read_text(encoding='utf-8')
          assert "applicationId 'com.defjam.nv2apgraphv20d'" in g
          assert 'versionCode 22' in g
          g=g.replace("applicationId 'com.defjam.nv2apgraphv20d'",
                      "applicationId 'com.defjam.nv2apgraphv20e'")
          g=g.replace('versionCode 22','versionCode 23')
          g=g.replace("versionName '0.20.4'","versionName '0.20.5'")
          gradle.write_text(g,encoding='utf-8')
          manifest=base/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text(encoding='utf-8')
          assert 'Def Jam - Diagnostico NV2A V20D' in m
          manifest.write_text(m.replace('Def Jam - Diagnostico NV2A V20D',
                                        'Def Jam - NV2A Novo Link V20E'),encoding='utf-8')
          java=base/'app/src/main/java/com/defjam/rendererprobe/MainActivity.java'
          s=java.read_text(encoding='utf-8')
          assert 'V20D' in s and 'v20d-last-step.txt' in s
          java.write_text(s.replace('V20D','V20E').replace('v20d-last-step.txt','v20e-last-step.txt'),encoding='utf-8')
          native=base/'app/src/main/cpp/renderer_probe.c'
          s=native.read_text(encoding='utf-8')
          assert 'v20d_checkpoint' in s
          native.write_text(s.replace('NV2A XBOX V20D','NV2A XBOX V20E').replace('V20C:','V20E:'),encoding='utf-8')
          print('V20E app packaged separately with persistent crash checkpoint diagnostics.')
          PYNAMING

      - name: Build V20E APK and verify correct dependency inside final package
        shell: bash
        run: |
          set -euo pipefail
          gradle -p defjam-v15 :app:assembleDebug --no-daemon --stacktrace > v20e-logs/gradle-build.log 2>&1 || {
            tail -n 160 v20e-logs/gradle-build.log
            exit 1
          }
          apk=defjam-v15/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" > v20e-logs/apk-contents.txt
          for lib in libxbox_nv2a_vulkan_v19.so libxbox_d3d8_vk_experimental.so libc++_shared.so libv20probe.so; do
            grep -Fq "lib/arm64-v8a/$lib" v20e-logs/apk-contents.txt || {
              echo "Missing ARM64 native library: $lib" >&2
              exit 1
            }
          done
          unzip -p "$apk" lib/arm64-v8a/libxbox_nv2a_vulkan_v19.so > /tmp/v20e-apk-nv2a.so
          ndkbin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndkbin/llvm-readelf" -d /tmp/v20e-apk-nv2a.so > v20e-logs/apk-nv2a-dynamic.txt
          grep -Fq 'Shared library: [libxbox_d3d8_vk_experimental.so]' v20e-logs/apk-nv2a-dynamic.txt
          if grep -q 'Shared library: \[[^]]*/' v20e-logs/apk-nv2a-dynamic.txt; then
            echo 'Invalid DT_NEEDED path remains in APK' >&2
            exit 1
          fi
          sha256sum "$apk" > v20e-logs/apk-sha256.txt
          echo 'V20E APK: native ARM64 compile & Android-safe library dependencies PASS.'
          echo 'No original game data executed; live phone test required.'

      - name: Publish V20E NV2A Android APK
        uses: actions/upload-artifact@v4
        with:
          name: defjam-v20e-native-nv2a-relink-apk
          path: defjam-v15/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish V20E native linker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defjam-v20e-native-linker-diagnostics
          path: v20e-logs/
          if-no-files-found: warn
