name: Def Jam - V7C Xbox kernel module isolated test

on:
  push:
    branches: [android-prototype]
    paths:
      - '.github/workflows/android-runtime-v7c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xbox-crypto-android:
    name: Link and run genuine Xbox kernel crypto module on Android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout project and pinned Xbox runtime
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Java and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Android and earlier test sources
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f tools/xboxrecomp/src/kernel/kernel_crypto.c
          test -f tools/xboxrecomp/src/platform/win32_compat.c
          test -f .github/workflows/android-runtime-v6.yml
          test -f .github/workflows/android-runtime-v7.yml

      - name: Apply verified V6 compatibility workarounds to temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/android-runtime-v6.yml').read_text(encoding='utf-8')
          header = '      - name: Apply temporary Android compatibility adaptations\n'
          assert src.count(header) == 1, 'Missing V6 patch step'
          a = src.index('        run: |\n', src.index(header)) + len('        run: |\n')
          b = src.index('      - name: ', a)
          block = src[a:b].splitlines(keepends=True)
          cmd = []
          for line in block:
              if not line.strip(): cmd.append('\n')
              elif line.startswith('          '): cmd.append(line[10:])
              else: raise RuntimeError('Invalid V6 indentation: '+repr(line))
          Path('/tmp/apply-android-v6.sh').write_text('set -euo pipefail\n'+''.join(cmd), encoding='utf-8')
          PY
          bash /tmp/apply-android-v6.sh

      - name: Generate V7 native Android activity and JNI test source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/android-runtime-v7.yml').read_text(encoding='utf-8')
          header = '      - name: Generate game-free Android app with actual Xbox kernel test\n'
          assert src.count(header) == 1, 'Missing V7 Android app generator'
          a = src.index('        run: |\n', src.index(header)) + len('        run: |\n')
          b = src.index('      - name: ', a)
          block = src[a:b].splitlines(keepends=True)
          cmd = []
          for line in block:
              if not line.strip(): cmd.append('\n')
              elif line.startswith('          '): cmd.append(line[10:])
              else: raise RuntimeError('Invalid V7 indentation: '+repr(line))
          Path('/tmp/generate-android-v7.sh').write_text('set -euo pipefail\n'+''.join(cmd), encoding='utf-8')
          PY
          bash /tmp/generate-android-v7.sh

      - name: Restrict native test to real crypto module and POSIX compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cmake = Path('android-v7/app/src/main/cpp/CMakeLists.txt')
          code = cmake.read_text(encoding='utf-8')
          kernel_subdir = 'add_subdirectory("${XBOXRECOMP_ROOT}/src/kernel" "${CMAKE_BINARY_DIR}/xbox_kernel")'
          assert code.count(kernel_subdir) == 1, 'Unexpected kernel subdirectory'
          code = code.replace(kernel_subdir, '# Do not link entire kernel; renderer is not yet ported')
          before = 'add_library(xboxkerneltest SHARED xbox_kernel_test.cpp)'
          after = 'add_library(xboxkerneltest SHARED xbox_kernel_test.cpp "${XBOXRECOMP_ROOT}/src/kernel/kernel_crypto.c")'
          assert code.count(before) == 1, 'Native test library declaration not found'
          code = code.replace(before, after)
          before = 'target_link_libraries(xboxkerneltest PRIVATE xbox_kernel platform recomp_settings)'
          after = 'target_link_libraries(xboxkerneltest PRIVATE platform recomp_settings)'
          assert code.count(before) == 1, 'Native link line not found'
          code = code.replace(before, after)
          cmake.write_text(code, encoding='utf-8')
          gradle = Path('android-v7/app/build.gradle')
          s = gradle.read_text(encoding='utf-8')
          s = s.replace("applicationId 'com.defjam.kerneltest'", "applicationId 'com.defjam.kerneltest'")
          s = s.replace("versionName '0.7'", "versionName '0.7c'")
          gradle.write_text(s, encoding='utf-8')
          print('Linking real kernel_crypto.c + real platform, not the unfinished graphics engine.')
          PY

      - name: Compile JNI bridge and genuine Xbox kernel crypto module
        shell: bash
        run: gradle -p android-v7 :app:assembleDebug --no-daemon --stacktrace

      - name: Validate ARM64 library embedded in APK
        shell: bash
        run: |
          unzip -l android-v7/app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libxboxkerneltest.so'

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: defjam-xbox-kernel-module-v7c-apk
          path: android-v7/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
