name: Def Jam - Android Xbox Runtime V6 compatibility test

on:
  push:
    branches: [android-prototype]
    paths:
      - '.github/workflows/android-runtime-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-xbox-runtime:
    name: Probe real Xbox runtime on Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout original source and pinned Xbox toolkit
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Android NDK and source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -f tools/xboxrecomp/src/platform/win32_compat.c
          git -C tools/xboxrecomp rev-parse HEAD

      - name: Apply temporary Android compatibility adaptations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/xboxrecomp/src/platform/win32_compat.c')
          text = source.read_text(encoding='utf-8')
          def replace_once(before, after, label):
              global text
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(before, after, 1)
          replace_once('#include <sys/mman.h>\n',
                       '#include <sys/mman.h>\n#if defined(__ANDROID__)\n#include <sys/syscall.h>\n#endif\n', 'Android syscall header')
          replace_once('    pthread_cancel(o->thread);\n',
                       '''#if defined(__ANDROID__)
              /* Android Bionic has no pthread_cancel. Do not pretend the
                 thread terminated: this behavior still needs a real port. */
              (void)exitCode;
              errno = ENOSYS;
              return FALSE;
          #else
              pthread_cancel(o->thread);
          #endif
          ''', 'pthread_cancel compatibility')
          replace_once('''#if defined(__APPLE__)
              memset_s(ptr, cnt, 0, cnt);
          #else
              explicit_bzero(ptr, cnt);
          #endif
          ''', '''#if defined(__APPLE__)
              memset_s(ptr, cnt, 0, cnt);
          #elif defined(__ANDROID__)
              /* Volatile writes cannot be optimized out like normal memset. */
              volatile unsigned char *p = (volatile unsigned char *)ptr;
              while (cnt--) *p++ = 0;
          #else
              explicit_bzero(ptr, cnt);
          #endif
          ''', 'secure erase compatibility')
          replace_once('''#else
              return memfd_create(name ? name : "xbox_map", 0);
          #endif
          ''', '''#elif defined(__ANDROID__)
              /* Android exposes memfd_create through the Linux syscall ABI. */
              return (int)syscall(__NR_memfd_create, name ? name : "xbox_map", 0);
          #else
              return memfd_create(name ? name : "xbox_map", 0);
          #endif
          ''', 'anonymous shared mapping compatibility')
          source.write_text(text, encoding='utf-8')
          Path('build-logs/compatibility-notes.txt').write_text('''Temporary experimental compile adaptations to the pinned Xbox runtime:
          - TerminateThread: unsupported on Android (returns FALSE / ENOSYS); functional Xbox thread termination NOT implemented.
          - SecureZeroMemory: volatile byte-by-byte clear.
          - memfd_create: raw Android/Linux syscall.
          No game files are included. Success is only a compile test, not proof of runtime correctness.
          ''', encoding='utf-8')
          print('Applied three Android-specific compatibility changes in CI workspace only.')
          PY

      - name: Configure Android ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-runtime-probe build-logs
          cat > android-runtime-probe/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22.1)
          project(defjam_android_runtime_probe LANGUAGES C)
          set(CMAKE_C_STANDARD 11)
          if(NOT DEFINED XBOXRECOMP_ROOT)
            message(FATAL_ERROR "XBOXRECOMP_ROOT was not set")
          endif()
          add_subdirectory("${XBOXRECOMP_ROOT}/src/settings" "${CMAKE_BINARY_DIR}/settings")
          add_subdirectory("${XBOXRECOMP_ROOT}/src/platform" "${CMAKE_BINARY_DIR}/platform")
          add_subdirectory("${XBOXRECOMP_ROOT}/src/kernel" "${CMAKE_BINARY_DIR}/kernel")
          CMAKE
          cmake -S android-runtime-probe -B android-runtime-probe/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DXBOXRECOMP_ROOT="$GITHUB_WORKSPACE/tools/xboxrecomp" \
            2>&1 | tee build-logs/configure.log

      - name: Compile real runtime libraries and log failures
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build-logs
          failed=0
          : > build-logs/results.txt
          for target in recomp_settings platform xbox_kernel; do
            echo "=== $target ===" | tee -a build-logs/results.txt
            if cmake --build android-runtime-probe/build --target "$target" --parallel 2 \
                 > "build-logs/$target.log" 2>&1; then
              echo "PASS: $target (Android ARM64, compilation only)" | tee -a build-logs/results.txt
            else
              echo "FAIL: $target (see $target.log)" | tee -a build-logs/results.txt
              tail -n 100 "build-logs/$target.log"
              failed=1
            fi
          done
          cat build-logs/results.txt
          exit "$failed"

      - name: Upload diagnostic logs even if compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defjam-android-runtime-v6-logs
          path: build-logs/
          if-no-files-found: warn
