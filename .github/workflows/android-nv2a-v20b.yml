name: Def Jam - V20B corrected Xbox NV2A real GPU bridge Android

'on':
  push:
    branches: [android-prototype]
    paths:
      - '.github/workflows/android-nv2a-v20b.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  corrected-nv2a-draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout pinned Xbox runtime and prior workflows
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Rebuild V16 and include authentic V19 NV2A library
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREUSE'
          from pathlib import Path
          import subprocess

          prior = Path('.github/workflows/android-nv2a-v20.yml').read_text(encoding='utf-8')
          stages = [
              'Rebuild verified V16 Android draw test project',
              'Include V19 genuine NV2A translator ARM64 shared object',
          ]
          def script_for(name):
              marker = '      - name: '+name+'\n'
              assert prior.count(marker)==1, 'Missing V20 stage '+name
              beg = prior.index('        run: |\n',prior.index(marker))+len('        run: |\n')
              end = prior.find('\n      - name: ',beg)
              if end < 0: end=len(prior)
              lines=[]
              for line in prior[beg:end].splitlines(keepends=True):
                  if not line.strip(): lines.append('\n')
                  elif line.startswith('          '): lines.append(line[10:])
                  else: raise RuntimeError('Bad V20 indentation '+repr(line))
              return ''.join(lines)
          for index,name in enumerate(stages,1):
              file=Path('/tmp/v20b-reuse-'+str(index)+'.sh')
              file.write_text('set -euo pipefail\n'+script_for(name),encoding='utf-8')
              subprocess.run(['bash','-n',str(file)],check=True)
              print('Executing validated setup:',name,flush=True)
              subprocess.run(['bash',str(file)],check=True)
          PYREUSE
      - name: Correct V20 patch and add authentic NV2A header path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCORRECT'
          from pathlib import Path
          import subprocess
          original=Path('.github/workflows/android-nv2a-v20.yml').read_text(encoding='utf-8')
          name='Switch V16 direct triangle to genuine NV2A PGRAPH vertex translation'
          marker='      - name: '+name+'\n'
          assert original.count(marker)==1
          start=original.index('        run: |\n',original.index(marker))+len('        run: |\n')
          end=original.find('\n      - name: ',start)
          script=''
          for line in original[start:end].splitlines(keepends=True):
              if not line.strip(): script+='\n'
              elif line.startswith('          '): script+=line[10:]
              else: raise RuntimeError('Incorrect indentation in V20 original')
          replacements=[
              ("before='              /* Each vertex:", "before='/* Each vertex:"),
              ("after='              IDirect3DSurface8 *back = NULL;'", "after='IDirect3DSurface8 *back = NULL;'"),
              ('../nv2a/nv2a_pgraph_d3d11.h', 'nv2a_pgraph_d3d11.h'),
          ]
          for old,new in replacements:
              assert script.count(old)==1,(old,script.count(old))
              script=script.replace(old,new)
          patched=Path('/tmp/v20b-corrected-patch.sh')
          patched.write_text('set -euo pipefail\n'+script,encoding='utf-8')
          subprocess.run(['bash','-n',str(patched)],check=True)
          subprocess.run(['bash',str(patched)],check=True)

          cmake=Path('defjam-v15/app/src/main/cpp/CMakeLists.txt')
          c=cmake.read_text(encoding='utf-8')
          assert 'add_library(v20probe' in c
          assert 'XBOXRECOMP_ROOT' in c
          c+='\n# Include genuine original Xbox NV2A translator types.\n'
          c+='target_include_directories(v20probe PRIVATE "${XBOXRECOMP_ROOT}/src/nv2a")\n'
          cmake.write_text(c,encoding='utf-8')
          assert '#include "nv2a_pgraph_d3d11.h"' in Path('defjam-v15/app/src/main/cpp/renderer_probe.c').read_text()
          print('PASS V20B: original 2 incorrect whitespace anchors fixed, NV2A header path added.')
          PYCORRECT
      - name: Compile real NV2A GPU drawing APK for Galaxy M55
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v20-logs
          gradle -p defjam-v15 :app:assembleDebug --no-daemon --stacktrace > v20-logs/v20b-gradle-build.log 2>&1 || {
            tail -n 150 v20-logs/v20b-gradle-build.log
            exit 1
          }
          apk=defjam-v15/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" > v20-logs/v20b-apk-contents.txt
          for name in libxbox_nv2a_vulkan_v19.so libxbox_d3d8_vk_experimental.so libc++_shared.so libv20probe.so; do
            grep -Fq "lib/arm64-v8a/$name" v20-logs/v20b-apk-contents.txt || {
              echo "Missing native library $name"
              exit 1
            }
          done
          sha256sum "$apk" > v20-logs/v20b-sha256.txt
          du -h "$apk"
          echo 'V20B build PASS. Real PGRAPH -> D3D8 Vulkan drawing still requires on-device verification.'
      - name: Publish V20B corrected NV2A test APK
        uses: actions/upload-artifact@v4
        with:
          name: defjam-v20b-real-nv2a-gpu-apk
          path: defjam-v15/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish V20B build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defjam-v20b-real-nv2a-build-report
          path: v20-logs/
          if-no-files-found: warn
